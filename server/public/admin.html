<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .tab-button.active {
            background-color: #6366f1;
            color: white;
        }
    </style>
</head>

<body class="bg-gray-100">
    <!-- Login Page -->
    <div id="loginPage" class="min-h-screen flex items-center justify-center">
        <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
            <h1 class="text-3xl font-bold text-center mb-6 text-indigo-600">Admin Login</h1>
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-gray-700 mb-2">Username</label>
                    <input type="text" id="username"
                        class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500" required>
                </div>
                <div>
                    <label class="block text-gray-700 mb-2">Password</label>
                    <input type="password" id="password"
                        class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500" required>
                </div>
                <div id="loginError" class="text-red-500 text-sm hidden"></div>
                <button type="submit"
                    class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 transition">
                    Login
                </button>
            </form>
        </div>
    </div>

    <!-- Admin Dashboard -->
    <div id="adminDashboard" class="hidden">
        <!-- Header -->
        <header class="bg-indigo-600 text-white p-4 shadow-lg">
            <div class="container mx-auto flex justify-between items-center">
                <h1 class="text-2xl font-bold">Portfolio Admin Panel</h1>
                <button id="logoutBtn" class="bg-red-500 px-4 py-2 rounded hover:bg-red-600 transition">
                    Logout
                </button>
            </div>
        </header>

        <!-- Navigation Tabs -->
        <div class="bg-white shadow-md">
            <div class="container mx-auto">
                <div class="flex space-x-1 p-2">
                    <button class="tab-button active px-6 py-3 rounded-t-lg transition"
                        data-tab="dashboard">Dashboard</button>
                    <button class="tab-button px-6 py-3 rounded-t-lg transition" data-tab="resumes">Resumes</button>
                    <button class="tab-button px-6 py-3 rounded-t-lg transition" data-tab="projects">Projects</button>
                    <button class="tab-button px-6 py-3 rounded-t-lg transition" data-tab="contacts">Contacts</button>
                </div>
            </div>
        </div>

        <!-- Content Area -->
        <div class="container mx-auto p-6">
            <!-- Dashboard Tab -->
            <div id="dashboard" class="tab-content active">
                <h2 class="text-3xl font-bold mb-6">Dashboard</h2>

                <!-- Stats Cards -->
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-6 mb-8">
                    <div class="bg-white p-6 rounded-lg shadow-lg">
                        <div class="text-gray-500 text-sm">Total Resumes</div>
                        <div id="statTotalResumes" class="text-3xl font-bold text-indigo-600">0</div>
                    </div>
                    <div class="bg-white p-6 rounded-lg shadow-lg">
                        <div class="text-gray-500 text-sm">Active Resume</div>
                        <div id="statActiveResume" class="text-lg font-semibold text-green-600">None</div>
                    </div>
                    <div class="bg-white p-6 rounded-lg shadow-lg">
                        <div class="text-gray-500 text-sm">Total Downloads</div>
                        <div id="statTotalDownloads" class="text-3xl font-bold text-purple-600">0</div>
                    </div>
                    <div class="bg-white p-6 rounded-lg shadow-lg">
                        <div class="text-gray-500 text-sm">Total Projects</div>
                        <div id="statTotalProjects" class="text-3xl font-bold text-blue-600">0</div>
                        <div id="statFeaturedProjects" class="text-sm text-blue-500 mt-1"></div>
                    </div>
                    <div class="bg-white p-6 rounded-lg shadow-lg">
                        <div class="text-gray-500 text-sm">Contact Submissions</div>
                        <div id="statTotalContacts" class="text-3xl font-bold text-emerald-600">0</div>
                        <div id="statUnreadContacts" class="text-sm text-orange-500 mt-1"></div>
                    </div>
                </div>

                <!-- Recent Contacts -->
                <div class="bg-white p-6 rounded-lg shadow-lg">
                    <h3 class="text-xl font-bold mb-4">Recent Contact Submissions</h3>
                    <div id="recentContacts" class="space-y-2"></div>
                </div>
            </div>

            <!-- Resumes Tab -->
            <div id="resumes" class="tab-content">
                <h2 class="text-3xl font-bold mb-6">Resume Management</h2>

                <!-- Upload Form -->
                <div class="bg-white p-6 rounded-lg shadow-lg mb-6">
                    <h3 class="text-xl font-bold mb-4">Upload New Resume</h3>
                    <form id="uploadForm" class="flex gap-4 items-end">
                        <div class="flex-1">
                            <label class="block text-gray-700 mb-2">Select PDF File</label>
                            <input type="file" id="resumeFile" accept=".pdf" class="w-full px-4 py-2 border rounded-lg"
                                required>
                        </div>
                        <button type="submit"
                            class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700 transition">
                            Upload
                        </button>
                    </form>
                    <div id="uploadStatus" class="mt-2 text-sm"></div>
                </div>

                <!-- Resumes List -->
                <div class="bg-white p-6 rounded-lg shadow-lg">
                    <h3 class="text-xl font-bold mb-4">All Resumes</h3>
                    <div id="resumesList" class="overflow-x-auto"></div>
                </div>
            </div>

            <!-- Projects Tab -->
            <div id="projects" class="tab-content">
                <h2 class="text-3xl font-bold mb-6">Project Management</h2>

                <!-- Add/Edit Project Form -->
                <div class="bg-white p-6 rounded-lg shadow-lg mb-6">
                    <h3 class="text-xl font-bold mb-4" id="projectFormTitle">Add New Project</h3>
                    <form id="projectForm" class="space-y-4">
                        <input type="hidden" id="projectId">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-gray-700 mb-2">Title *</label>
                                <input type="text" id="projectTitle" class="w-full px-4 py-2 border rounded-lg"
                                    required>
                            </div>
                            <div>
                                <label class="block text-gray-700 mb-2">Status *</label>
                                <select id="projectStatus" class="w-full px-4 py-2 border rounded-lg" required>
                                    <option value="live">Live</option>
                                    <option value="in-progress">In Progress</option>
                                    <option value="completed">Completed</option>
                                </select>
                            </div>
                        </div>
                        <div>
                            <label class="block text-gray-700 mb-2">Description *</label>
                            <textarea id="projectDescription" rows="3" class="w-full px-4 py-2 border rounded-lg"
                                required></textarea>
                        </div>
                        <div>
                            <label class="block text-gray-700 mb-2">Problem</label>
                            <textarea id="projectProblem" rows="3" class="w-full px-4 py-2 border rounded-lg"
                                placeholder="What problem does this project solve?"></textarea>
                        </div>
                        <div>
                            <label class="block text-gray-700 mb-2">Solution</label>
                            <textarea id="projectSolution" rows="3" class="w-full px-4 py-2 border rounded-lg"
                                placeholder="How does your solution address the problem?"></textarea>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-gray-700 mb-2">Technologies (comma-separated) *</label>
                                <input type="text" id="projectTech" placeholder="React, Node.js, MongoDB"
                                    class="w-full px-4 py-2 border rounded-lg" required>
                            </div>
                            <div>
                                <label class="block text-gray-700 mb-2">GitHub URL</label>
                                <input type="url" id="projectGithub" placeholder="https://github.com/..."
                                    class="w-full px-4 py-2 border rounded-lg">
                            </div>
                        </div>
                        <div>
                            <label class="block text-gray-700 mb-2">Live URL</label>
                            <input type="url" id="projectLive" placeholder="https://..."
                                class="w-full px-4 py-2 border rounded-lg">
                        </div>
                        <div class="flex items-center">
                            <input type="checkbox" id="projectFeatured" class="mr-2">
                            <label for="projectFeatured" class="text-gray-700">Featured Project</label>
                        </div>
                        <div class="flex gap-4">
                            <button type="submit"
                                class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700 transition">
                                <span id="projectSubmitText">Add Project</span>
                            </button>
                            <button type="button" id="cancelEdit"
                                class="bg-gray-500 text-white px-6 py-2 rounded-lg hover:bg-gray-600 transition hidden">
                                Cancel
                            </button>
                        </div>
                    </form>
                    <div id="projectFormStatus" class="mt-2 text-sm"></div>
                </div>

                <!-- Projects List -->
                <div class="bg-white p-6 rounded-lg shadow-lg">
                    <h3 class="text-xl font-bold mb-4">All Projects</h3>
                    <div id="projectsList" class="overflow-x-auto"></div>
                </div>
            </div>

            <!-- Contacts Tab -->
            <div id="contacts" class="tab-content">
                <h2 class="text-3xl font-bold mb-6">Contact Submissions</h2>

                <div class="bg-white p-6 rounded-lg shadow-lg">
                    <div id="contactsList" class="overflow-x-auto"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin + '/api';
        let token = localStorage.getItem('adminToken');

        // Login Form
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch(`${API_BASE}/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (data.success) {
                    token = data.token;
                    localStorage.setItem('adminToken', token);
                    showDashboard();
                } else {
                    document.getElementById('loginError').textContent = data.message;
                    document.getElementById('loginError').classList.remove('hidden');
                }
            } catch (error) {
                document.getElementById('loginError').textContent = 'Login failed';
                document.getElementById('loginError').classList.remove('hidden');
            }
        });

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('adminToken');
            token = null;
            document.getElementById('loginPage').classList.remove('hidden');
            document.getElementById('adminDashboard').classList.add('hidden');
        });

        // Tab Switching
        document.querySelectorAll('.tab-button').forEach(btn => {
            btn.addEventListener('click', () => {
                const tabName = btn.dataset.tab;

                document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

                btn.classList.add('active');
                document.getElementById(tabName).classList.add('active');

                if (tabName === 'dashboard') loadDashboard();
                if (tabName === 'resumes') loadResumes();
                if (tabName === 'projects') loadProjects();
                if (tabName === 'contacts') loadContacts();
            });
        });

        // Show Dashboard
        function showDashboard() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('adminDashboard').classList.remove('hidden');
            loadDashboard();
        }

        // Load Dashboard Stats
        async function loadDashboard() {
            try {
                const res = await fetch(`${API_BASE}/admin/stats`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();

                if (data.success) {
                    const stats = data.stats;
                    document.getElementById('statTotalResumes').textContent = stats.totalResumes;
                    document.getElementById('statActiveResume').textContent = stats.activeResume;
                    document.getElementById('statTotalDownloads').textContent = stats.totalDownloads;
                    document.getElementById('statTotalProjects').textContent = stats.totalProjects;
                    document.getElementById('statFeaturedProjects').textContent =
                        stats.featuredProjects > 0 ? `${stats.featuredProjects} featured` : '';
                    document.getElementById('statTotalContacts').textContent = stats.totalContacts;
                    document.getElementById('statUnreadContacts').textContent =
                        stats.unreadContacts > 0 ? `${stats.unreadContacts} unread` : '';

                    // Recent contacts
                    const recentHTML = stats.recentContacts.map(c => `
                        <div class="flex justify-between items-center p-3 bg-gray-50 rounded ${c.isRead ? '' : 'border-l-4 border-orange-500'}">
                            <div>
                                <div class="font-semibold">${c.name}</div>
                                <div class="text-sm text-gray-600">${c.email}</div>
                            </div>
                            <div class="text-sm text-gray-500">
                                ${new Date(c.submittedAt).toLocaleDateString()}
                            </div>
                        </div>
                    `).join('');
                    document.getElementById('recentContacts').innerHTML = recentHTML || '<p class="text-gray-500">No contacts yet</p>';
                }
            } catch (error) {
                console.error('Failed to load stats:', error);
            }
        }

        // Load Resumes
        async function loadResumes() {
            try {
                const res = await fetch(`${API_BASE}/admin/resumes`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();

                if (data.success) {
                    const tableHTML = `
                        <table class="w-full">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-4 py-3 text-left">Filename</th>
                                    <th class="px-4 py-3 text-left">Uploaded</th>
                                    <th class="px-4 py-3 text-left">Downloads</th>
                                    <th class="px-4 py-3 text-left">Status</th>
                                    <th class="px-4 py-3 text-left">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${data.resumes.map(r => `
                                    <tr class="border-t">
                                        <td class="px-4 py-3">${r.originalName}</td>
                                        <td class="px-4 py-3">${new Date(r.uploadedAt).toLocaleDateString()}</td>
                                        <td class="px-4 py-3">${r.downloadCount}</td>
                                        <td class="px-4 py-3">
                                            ${r.isActive ?
                            '<span class="bg-green-100 text-green-800 px-2 py-1 rounded text-sm">Active</span>' :
                            '<span class="bg-gray-100 text-gray-800 px-2 py-1 rounded text-sm">Inactive</span>'
                        }
                                        </td>
                                        <td class="px-4 py-3">
                                            ${!r.isActive ?
                            `<button onclick="activateResume('${r._id}')" class="bg-indigo-600 text-white px-3 py-1 rounded text-sm hover:bg-indigo-700 mr-2">Activate</button>` :
                            ''
                        }
                                            <button onclick="deleteResume('${r._id}')" class="bg-red-600 text-white px-3 py-1 rounded text-sm hover:bg-red-700">Delete</button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    `;
                    document.getElementById('resumesList').innerHTML = tableHTML || '<p class="text-gray-500">No resumes uploaded</p>';
                }
            } catch (error) {
                console.error('Failed to load resumes:', error);
            }
        }

        // Upload Resume
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('resumeFile');
            const file = fileInput.files[0];

            if (!file) return;

            const formData = new FormData();
            formData.append('resume', file);

            try {
                document.getElementById('uploadStatus').innerHTML = '<span class="text-blue-600">Uploading...</span>';

                const res = await fetch(`${API_BASE}/admin/resumes/upload`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                });

                const data = await res.json();

                if (data.success) {
                    document.getElementById('uploadStatus').innerHTML = '<span class="text-green-600">✓ Upload successful!</span>';
                    fileInput.value = '';
                    loadResumes();
                } else {
                    document.getElementById('uploadStatus').innerHTML = `<span class="text-red-600">✗ ${data.message}</span>`;
                }
            } catch (error) {
                document.getElementById('uploadStatus').innerHTML = '<span class="text-red-600">✗ Upload failed</span>';
            }
        });

        // Activate Resume
        async function activateResume(id) {
            if (!confirm('Set this resume as active?')) return;

            try {
                const res = await fetch(`${API_BASE}/admin/resumes/${id}/activate`, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const data = await res.json();
                if (data.success) {
                    loadResumes();
                    loadDashboard();
                }
            } catch (error) {
                alert('Failed to activate resume');
            }
        }

        // Delete Resume
        async function deleteResume(id) {
            if (!confirm('Delete this resume?')) return;

            try {
                const res = await fetch(`${API_BASE}/admin/resumes/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const data = await res.json();
                if (data.success) {
                    loadResumes();
                    loadDashboard();
                }
            } catch (error) {
                alert('Failed to delete resume');
            }
        }

        // Load Contacts
        async function loadContacts() {
            try {
                const res = await fetch(`${API_BASE}/admin/contacts`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();

                if (data.success) {
                    const tableHTML = `
                        <table class="w-full">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-4 py-3 text-left">Name</th>
                                    <th class="px-4 py-3 text-left">Email</th>
                                    <th class="px-4 py-3 text-left">Message</th>
                                    <th class="px-4 py-3 text-left">Date</th>
                                    <th class="px-4 py-3 text-left">Status</th>
                                    <th class="px-4 py-3 text-left">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${data.contacts.map(c => `
                                    <tr class="border-t ${c.isRead ? '' : 'bg-orange-50'}">
                                        <td class="px-4 py-3">${c.name}</td>
                                        <td class="px-4 py-3">${c.email}</td>
                                        <td class="px-4 py-3 max-w-md truncate">${c.message}</td>
                                        <td class="px-4 py-3">${new Date(c.submittedAt).toLocaleString()}</td>
                                        <td class="px-4 py-3">
                                            ${c.isRead ?
                            '<span class="bg-gray-100 text-gray-800 px-2 py-1 rounded text-sm">Read</span>' :
                            '<span class="bg-orange-100 text-orange-800 px-2 py-1 rounded text-sm">New</span>'
                        }
                                        </td>
                                        <td class="px-4 py-3">
                                            ${!c.isRead ?
                            `<button onclick="markAsRead('${c._id}')" class="bg-green-600 text-white px-3 py-1 rounded text-sm hover:bg-green-700 mr-2">Mark Read</button>` :
                            ''
                        }
                                            <button onclick="deleteContact('${c._id}')" class="bg-red-600 text-white px-3 py-1 rounded text-sm hover:bg-red-700">Delete</button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    `;
                    document.getElementById('contactsList').innerHTML = tableHTML || '<p class="text-gray-500">No contact submissions</p>';
                }
            } catch (error) {
                console.error('Failed to load contacts:', error);
            }
        }

        // Mark Contact as Read
        async function markAsRead(id) {
            try {
                const res = await fetch(`${API_BASE}/admin/contacts/${id}/read`, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const data = await res.json();
                if (data.success) {
                    loadContacts();
                    loadDashboard();
                }
            } catch (error) {
                alert('Failed to mark as read');
            }
        }

        // Delete Contact
        async function deleteContact(id) {
            if (!confirm('Delete this contact submission?')) return;

            try {
                const res = await fetch(`${API_BASE}/admin/contacts/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const data = await res.json();
                if (data.success) {
                    loadContacts();
                    loadDashboard();
                }
            } catch (error) {
                alert('Failed to delete contact');
            }
        }

        // ============ PROJECT MANAGEMENT FUNCTIONS ============

        // Load Projects
        async function loadProjects() {
            try {
                const res = await fetch(`${API_BASE}/admin/projects`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();

                if (data.success) {
                    const tableHTML = `
                        <table class="w-full">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-4 py-3 text-left">Title</th>
                                    <th class="px-4 py-3 text-left">Technologies</th>
                                    <th class="px-4 py-3 text-left">Status</th>
                                    <th class="px-4 py-3 text-left">Featured</th>
                                    <th class="px-4 py-3 text-left">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${data.projects.map(p => `
                                    <tr class="border-t">
                                        <td class="px-4 py-3 font-semibold">${p.title}</td>
                                        <td class="px-4 py-3">
                                            ${(p.techStack || []).slice(0, 3).map(t =>
                        `<span class="bg-blue-100 text-blue-800 px-2 py-1 rounded text-xs mr-1">${t}</span>`
                    ).join('')}
                                            ${(p.techStack?.length || 0) > 3 ? `<span class="text-gray-500 text-xs">+${p.techStack.length - 3}</span>` : ''}
                                        </td>
                                        <td class="px-4 py-3">
                                            <span class="px-2 py-1 rounded text-sm ${p.status === 'live' ? 'bg-green-100 text-green-800' :
                            p.status === 'in-progress' ? 'bg-yellow-100 text-yellow-800' :
                                'bg-gray-100 text-gray-800'
                        }">${p.status}</span>
                                        </td>
                                        <td class="px-4 py-3">
                                            <button onclick="toggleFeatured('${p._id}')" 
                                                class="px-3 py-1 rounded text-sm ${p.isFeatured ?
                            'bg-yellow-100 text-yellow-800 hover:bg-yellow-200' :
                            'bg-gray-100 text-gray-600 hover:bg-gray-200'
                        }">
                                                ${p.isFeatured ? '⭐ Featured' : '☆ Feature'}
                                            </button>
                                        </td>
                                        <td class="px-4 py-3">
                                            <button onclick="editProject('${p._id}')" 
                                                class="bg-blue-600 text-white px-3 py-1 rounded text-sm hover:bg-blue-700 mr-2">
                                                Edit
                                            </button>
                                            <button onclick="deleteProject('${p._id}')" 
                                                class="bg-red-600 text-white px-3 py-1 rounded text-sm hover:bg-red-700">
                                                Delete
                                            </button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    `;
                    document.getElementById('projectsList').innerHTML = tableHTML || '<p class="text-gray-500">No projects yet</p>';
                }
            } catch (error) {
                console.error('Failed to load projects:', error);
            }
        }

        // Project Form Submit
        document.getElementById('projectForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const projectId = document.getElementById('projectId').value;
            const projectData = {
                title: document.getElementById('projectTitle').value,
                description: document.getElementById('projectDescription').value,
                problem: document.getElementById('projectProblem').value,
                solution: document.getElementById('projectSolution').value,
                techStack: document.getElementById('projectTech').value.split(',').map(t => t.trim()),
                githubUrl: document.getElementById('projectGithub').value,
                liveUrl: document.getElementById('projectLive').value,
                status: document.getElementById('projectStatus').value,
                isFeatured: document.getElementById('projectFeatured').checked
            };

            try {
                document.getElementById('projectFormStatus').innerHTML = '<span class="text-blue-600">Saving...</span>';

                const url = projectId ?
                    `${API_BASE}/admin/projects/${projectId}` :
                    `${API_BASE}/admin/projects`;

                const method = projectId ? 'PUT' : 'POST';

                const res = await fetch(url, {
                    method,
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(projectData)
                });

                const data = await res.json();

                if (data.success) {
                    document.getElementById('projectFormStatus').innerHTML =
                        `<span class="text-green-600">✓ ${projectId ? 'Updated' : 'Created'} successfully!</span>`;
                    document.getElementById('projectForm').reset();
                    document.getElementById('projectId').value = '';
                    document.getElementById('projectFormTitle').textContent = 'Add New Project';
                    document.getElementById('projectSubmitText').textContent = 'Add Project';
                    document.getElementById('cancelEdit').classList.add('hidden');
                    loadProjects();
                    loadDashboard();
                } else {
                    document.getElementById('projectFormStatus').innerHTML =
                        `<span class="text-red-600">✗ ${data.message}</span>`;
                }
            } catch (error) {
                document.getElementById('projectFormStatus').innerHTML =
                    '<span class="text-red-600">✗ Failed to save project</span>';
            }
        });

        // Edit Project
        async function editProject(id) {
            try {
                const res = await fetch(`${API_BASE}/admin/projects`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();

                if (data.success) {
                    const project = data.projects.find(p => p._id === id);
                    if (project) {
                        document.getElementById('projectId').value = project._id;
                        document.getElementById('projectTitle').value = project.title;
                        document.getElementById('projectDescription').value = project.description;
                        document.getElementById('projectProblem').value = project.problem || '';
                        document.getElementById('projectSolution').value = project.solution || '';
                        document.getElementById('projectTech').value = (project.techStack || []).join(', ');
                        document.getElementById('projectGithub').value = project.githubUrl || '';
                        document.getElementById('projectLive').value = project.liveUrl || '';
                        document.getElementById('projectStatus').value = project.status;
                        document.getElementById('projectFeatured').checked = project.isFeatured;

                        document.getElementById('projectFormTitle').textContent = 'Edit Project';
                        document.getElementById('projectSubmitText').textContent = 'Update Project';
                        document.getElementById('cancelEdit').classList.remove('hidden');

                        // Scroll to form
                        document.getElementById('projectForm').scrollIntoView({ behavior: 'smooth' });
                    }
                }
            } catch (error) {
                alert('Failed to load project details');
            }
        }

        // Cancel Edit
        document.getElementById('cancelEdit').addEventListener('click', () => {
            document.getElementById('projectForm').reset();
            document.getElementById('projectId').value = '';
            document.getElementById('projectFormTitle').textContent = 'Add New Project';
            document.getElementById('projectSubmitText').textContent = 'Add Project';
            document.getElementById('cancelEdit').classList.add('hidden');
            document.getElementById('projectFormStatus').innerHTML = '';
        });

        // Delete Project
        async function deleteProject(id) {
            if (!confirm('Delete this project?')) return;

            try {
                const res = await fetch(`${API_BASE}/admin/projects/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const data = await res.json();
                if (data.success) {
                    loadProjects();
                    loadDashboard();
                }
            } catch (error) {
                alert('Failed to delete project');
            }
        }

        // Toggle Featured
        async function toggleFeatured(id) {
            try {
                const res = await fetch(`${API_BASE}/admin/projects/${id}/toggle-featured`, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const data = await res.json();
                if (data.success) {
                    loadProjects();
                    loadDashboard();
                }
            } catch (error) {
                alert('Failed to toggle featured status');
            }
        }

        // Check if already logged in
        if (token) {
            showDashboard();
        }
    </script>
</body>

</html>
